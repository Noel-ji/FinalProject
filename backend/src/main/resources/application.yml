spring:
  application:
    name: backend
  server:
    port: ${BACKEND_PORT}

  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB
    session:
      cookie:
        same-site: none
        secure: false

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        naming:
          physical-strategy: com.prinCipal.chatbot.config.SnakeCaseNamingStrategy

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      client-type: lettuce
      timeout: 3000ms
      connect-timeout: 5000ms

  cache:
    type: redis

  h2:
    console:
      enabled: false
      path: /h2-console
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 400ms
      additional-paths:
        - src/main/java
    livereload:
      enabled: true
      port: 35729

  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:2}
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # ✅ [여기 추가: 정적 리소스 서빙 설정]
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0  # 변경 시 바로 반영되게 (개발용)

# Redis queue key (fastapi ↔ spring 연결용)
app:
  redis:
    queue-key: ${REDIS_QUEUE_KEY:chatlog_queue}
  frontend:
    url: http://localhost:3000 
  backend:
    url: http://localhost:8080

# Health check, actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  server:
    port: 8080
  health:
    redis:
      enabled: false
